name: Compress and Upload Xray Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 25.9.11)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip upx-ucl

      - name: Download and process Xray-linux-arm64-v8a.zip
        run: |
          wget https://github.com/XTLS/Xray-core/releases/download/v${{ inputs.version }}/Xray-linux-arm64-v8a.zip
          unzip -j Xray-linux-arm64-v8a.zip xray
          rm Xray-linux-arm64-v8a.zip
          upx --best xray
          zip Xray-linux-arm64-v8a.zip xray
          rm xray

      - name: Download and process Xray-linux-mips32le.zip
        run: |
          wget https://github.com/XTLS/Xray-core/releases/download/v${{ inputs.version }}/Xray-linux-mips32le.zip
          unzip -j Xray-linux-mips32le.zip xray
          rm Xray-linux-mips32le.zip
          upx --best xray
          zip Xray-linux-mips32le.zip xray
          rm xray

      - name: Download and process Xray-linux-mips32.zip
        run: |
          wget https://github.com/XTLS/Xray-core/releases/download/v${{ inputs.version }}/Xray-linux-mips32.zip
          unzip -j Xray-linux-mips32.zip xray
          rm Xray-linux-mips32.zip
          upx --best xray
          zip Xray-linux-mips32.zip xray
          rm xray

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "UPX-Compressed Xray Binaries for Routers v${{ inputs.version }}"
          body: "Compressed Xray binary files for selected architectures"
          prerelease: ${{ inputs.prerelease }}
          files: |
            Xray-linux-arm64-v8a.zip
            Xray-linux-mips32le.zip
            Xray-linux-mips32.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}